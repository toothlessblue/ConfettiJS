<!DOCTYPE html>
<html>
<head>
    <title>Confetti!</title>

    <script type="module" defer>
        import {ConfettiEngine} from './dist/index.js';
        
        let engine = new ConfettiEngine({
            fullscreen: true,
        });

        window.addEventListener('click', (event) => {
            engine.createConfettiInstances((i) => {
                let angle = 3.0 * Math.PI / 8.0 + Math.random() * Math.PI / 4.0;
                let xc = Math.cos(angle);
                let yc = Math.sin(angle);
                let speed = 5.0 + (Math.random() * 1.0);

                return [
                    [event.clientX, engine.canvas.height - event.clientY, 0.0],
                    [speed * xc, speed * yc, 0.0],
                    [Math.random() * Math.PI,Math.random() * Math.PI,Math.random() * Math.PI],
                    [2,1,1],
                ];
            }, 1000);
        });

        engine.start();
    </script>

    <style>
        * {
            background-color: #111111;
        }
    </style>
</head>

<body>
</body>
</html>
